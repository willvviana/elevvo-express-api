# .github/workflows/ci.yml
#
# CI pipeline. Runs on every push and PR targeting main.
#
# What it does:
#   1. Spins up Postgres and Redis service containers.
#   2. Installs deps with `npm ci`.
#   3. Generates the Prisma client.
#   4. Applies migrations to the test DB.
#   5. Typechecks.
#   6. Builds the TS project.
#   7. Runs the test suite.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck, build, test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: elevvo
          POSTGRES_PASSWORD: elevvo_dev_password
          POSTGRES_DB: elevvo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U elevvo -d elevvo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://elevvo:elevvo_dev_password@localhost:5432/elevvo_test?schema=public
      TEST_DATABASE_URL: postgresql://elevvo:elevvo_dev_password@localhost:5432/elevvo_test?schema=public
      REDIS_URL: redis://localhost:6379
      API_KEY: test-api-key
      JWT_SECRET: test-jwt-secret-at-least-32-characters-long
      JWT_EXPIRES_IN: 1h
      ALLOWED_ORIGINS: http://localhost:5173
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Typecheck
        run: npm run typecheck

      - name: Build TypeScript
        run: npm run build

      - name: Run tests
        run: npm test