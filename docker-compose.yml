# docker-compose.yml

services:
  db:
    image: postgres:16-alpine
    container_name: elevvo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: elevvo
      POSTGRES_PASSWORD: elevvo_dev_password
      POSTGRES_DB: elevvo_dev
    ports:
      # Host port 5433 because native Windows Postgres occupies 5432.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elevvo -d elevvo_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  cache:
    image: redis:7-alpine
    container_name: elevvo-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata: